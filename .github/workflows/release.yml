name: Rolling
on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  packages: read

# Keep this workflow identity: run_number is the immutable per-repository sequence.
# No concurrency queue: consecutive merges must each run, even when an older run fails.
jobs:
  checks:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/build.yml
    with:
      source_sha: ${{ github.event.pull_request.merge_commit_sha }}
      sequence: ${{ format('{0}', github.run_number) }}
    permissions:
      contents: read
      packages: read

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      packages: read
    env:
      ROLLING_SEQUENCE: ${{ github.run_number }}
      ROLLING_SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@waksana'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cockpit-file-${{ github.event.pull_request.merge_commit_sha }}-linux-x64
          path: release-artifact
      - name: Verify, recover immutable draft, and publish Rolling
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rolling-release.mjs publish release-artifact
