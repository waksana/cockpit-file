name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cockpit-file-${{ github.sha }}-linux-x64
          path: release-artifact
      - name: Verify source, tag and downloaded archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG" "$GITHUB_SHA" release-artifact
      - name: Publish the checked tgz
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ARCHIVE="release-artifact/cockpit-file-${RELEASE_TAG#v}.tgz"
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" "$ARCHIVE.sha256" \
            --verify-tag --latest --title "Cockpit File $RELEASE_TAG" \
            --notes-file docs/release-notes.md --generate-notes
