name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: read

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@waksana'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cockpit-file-${{ github.sha }}-linux-x64
          path: release-artifact
      - name: Verify source, tag and downloaded archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG" "$GITHUB_SHA" release-artifact
      - name: Stage and verify the checked tgz
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ARCHIVE="release-artifact/cockpit-file-${RELEASE_TAG#v}.tgz"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            >existing-release.json 2>release-lookup.err; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          elif ! grep -Fq 'HTTP 404' release-lookup.err; then
            cat release-lookup.err >&2
            echo "Could not prove that $RELEASE_TAG is unused." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" "$ARCHIVE.sha256" \
            --verify-tag --draft --title "Cockpit File $RELEASE_TAG" \
            --notes-file docs/release-notes.md --generate-notes

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >draft-release.json
          jq -e --arg tag "$RELEASE_TAG" --arg archive "${ARCHIVE##*/}" '
            .tag_name == $tag and .draft == true and .prerelease == false and
            ([.assets[].name] | sort) ==
              ([$archive, ($archive + ".sha256")] | sort) and
            all(.assets[]; .size > 0)
          ' draft-release.json

          mkdir published-artifact
          gh release download "$RELEASE_TAG" --dir published-artifact \
            --pattern "${ARCHIVE##*/}" --pattern "${ARCHIVE##*/}.sha256"
          node scripts/check-release.mjs \
            "$RELEASE_TAG" "$GITHUB_SHA" published-artifact

      - name: Publish the complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ARCHIVE="cockpit-file-${RELEASE_TAG#v}.tgz"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >published-release.json
          jq -e --arg tag "$RELEASE_TAG" --arg archive "$ARCHIVE" '
            .tag_name == $tag and .draft == false and .prerelease == false and
            ([.assets[].name] | sort) ==
              ([$archive, ($archive + ".sha256")] | sort) and
            all(.assets[]; .size > 0)
          ' published-release.json
