name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      sequence:
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@waksana'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and package the isolated identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SEQUENCE: ${{ inputs.sequence }}
        run: |
          if [ -n "$SEQUENCE" ]; then
            export ROLLING_SEQUENCE="$SEQUENCE" ROLLING_SOURCE_SHA="$SOURCE_SHA"
          fi
          pnpm build
          pnpm package
      - id: integration
        name: Read pinned integration host
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SEQUENCE: ${{ inputs.sequence }}
        run: |
          if [ -n "$SEQUENCE" ]; then
            export ROLLING_SEQUENCE="$SEQUENCE" ROLLING_SOURCE_SHA="$SOURCE_SHA"
          fi
          node scripts/host-integration.mjs >> "$GITHUB_OUTPUT"
      - name: Verify the exact module archive
        env:
          ARCHIVE: ${{ steps.integration.outputs.archive }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          SEQUENCE: ${{ inputs.sequence }}
        run: |
          if [ -n "$SEQUENCE" ]; then
            export ROLLING_SEQUENCE="$SEQUENCE" ROLLING_SOURCE_SHA="$SOURCE_SHA"
          fi
          node scripts/verify-package.mjs "module-output/$ARCHIVE" "$SOURCE_SHA"
      - name: Check out the integration host (not a build input)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ steps.integration.outputs.repository }}
          ref: ${{ steps.integration.outputs.commit }}
          path: .host-integration
          fetch-depth: 1
          persist-credentials: false
      - name: Install isolated host test dependencies
        run: pnpm --dir .host-integration install --frozen-lockfile --ignore-scripts
      - name: Exercise the packaged module through the pinned host
        env:
          COCKPIT_FILE_MODULE_ARCHIVE: ${{ github.workspace }}/module-output/${{ steps.integration.outputs.archive }}
          COCKPIT_HOST_SOURCE: ${{ github.workspace }}/.host-integration
          NODE_DISABLE_COMPILE_CACHE: '1'
          TSX_DISABLE_CACHE: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/file-integration/home" "$RUNNER_TEMP/file-integration/copilot" "$RUNNER_TEMP/file-integration/cockpit"
          cd .host-integration
          HOME="$RUNNER_TEMP/file-integration/home" \
          COPILOT_HOME="$RUNNER_TEMP/file-integration/copilot" \
          COCKPIT_HOME="$RUNNER_TEMP/file-integration/cockpit" \
          timeout 300 node --import ./apps/server/node_modules/tsx/dist/loader.mjs --test \
            apps/server/src/module-file.integration.test.ts \
            "$GITHUB_WORKSPACE/scripts/test-support/capture-feedback.integration.mjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cockpit-file-${{ inputs.source_sha || github.sha }}-linux-x64
          path: |
            module-output/*.tgz
            module-output/*.tgz.sha256
            module-output/cockpit-deployment.json
            module-output/cockpit-deployment.json.sha256
          if-no-files-found: error
          retention-days: 7
